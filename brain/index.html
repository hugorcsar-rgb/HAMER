<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMER Brain</title>
<!-- Permite instalarla desde Safari en iPhone: Compartir → Agregar a inicio -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1B29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAMER Brain">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1B29;--navy-2:#112838;--navy-3:#193C55;--teal:#3FB6A8;--teal-dim:#2A8478;
--cream:#F2EDE1;--cream-dim:#B9B3A6;--sand:#847D71;--alert:#E08B4C;--good:#5FCF8E;--line:rgba(242,237,225,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--cream);font-family:'Montserrat',system-ui,sans-serif;font-weight:300;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.08}
.app{display:flex;min-height:100vh}
.rail{width:228px;flex:0 0 228px;border-right:1px solid var(--line);padding:24px 0 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--navy)}
.brand{padding:0 22px 20px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .mark{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;letter-spacing:.15em}
.brand .sub{font-size:10px;letter-spacing:.26em;color:var(--teal);margin-top:4px;font-weight:600}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--cream-dim);font-family:inherit;font-size:13.5px;font-weight:400;padding:10px 22px;cursor:pointer;text-align:left;border-left:2px solid transparent}
.navbtn:hover{color:var(--cream)}
.navbtn.on{color:var(--cream);border-left-color:var(--teal);background:rgba(63,182,168,.08)}
.navbtn .ico{width:16px;text-align:center;font-size:14px;opacity:.85}
.railfoot{margin-top:auto;padding:14px 22px 0;border-top:1px solid var(--line)}
.langsw{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;width:fit-content}
.langsw button{background:none;border:0;color:var(--cream-dim);font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;padding:6px 12px;cursor:pointer}
.langsw button.on{background:var(--teal);color:#08161F}
main{flex:1;min-width:0;padding:36px 44px 110px;max-width:1020px}
.view{display:none}.view.on{display:block;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view.on{animation:none}}
.vhead{margin-bottom:24px}.vhead h1{font-size:40px}
.vhead p{color:var(--cream-dim);font-size:14.5px;margin-top:7px;max-width:62ch}
.panel{background:var(--navy-2);border:1px solid var(--line);border-radius:3px;padding:22px 24px;margin-bottom:16px}
.panel.cream{background:var(--cream);color:#112838;border-color:transparent}
.panel.cream .muted{color:#5C6874}
.panel h2{font-size:23px;margin-bottom:4px}.panel h3{font-size:18px;margin-bottom:10px}
.muted{color:var(--cream-dim);font-size:13.5px}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:260px}
.hr{height:1px;background:var(--line);margin:18px 0}
.btn{font-family:inherit;font-size:13.5px;font-weight:500;background:var(--teal);color:#08161F;border:0;border-radius:2px;padding:11px 20px;cursor:pointer}
.btn:hover{background:#4FC9BA}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(242,237,225,.06)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn:focus-visible,.chip:focus-visible,.navbtn:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.chip{font-family:inherit;font-size:12.5px;background:transparent;color:var(--cream-dim);border:1px solid var(--line);border-radius:2px;padding:8px 14px;cursor:pointer}
.chip:hover{border-color:var(--teal-dim);color:var(--cream)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#08161F;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;font-size:11px;letter-spacing:.1em;color:var(--sand);margin-bottom:5px;font-weight:600}
input{font-family:inherit;font-size:14px;font-weight:400;width:100%;background:var(--navy);color:var(--cream);border:1px solid var(--line);border-radius:2px;padding:10px 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero .n{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:.9;color:var(--alert)}
.hero .n.good{color:var(--good)}
.hero .u{font-size:14px;color:#5C6874;max-width:34ch}
.sg{margin-bottom:12px}
.sg .l{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:5px}
.sg .v{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--alert)}
.sg .v.good{color:var(--good)}
.track{height:6px;background:rgba(242,237,225,.08);border-radius:3px;position:relative;overflow:hidden}
.track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(242,237,225,.28)}
.track i{position:absolute;top:0;bottom:0;background:var(--alert);border-radius:2px;transition:all .5s}
.track i.good{background:var(--good)}
.legend{font-size:11px;color:var(--sand);display:flex;justify-content:space-between;margin-top:8px}
.drill{border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin-bottom:10px;background:var(--navy)}
.drill.inc{border-color:var(--teal-dim);background:rgba(63,182,168,.05)}
.drill .dh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.drill .nm{font-size:15px;font-weight:500}
.drill .meta{font-size:12px;color:var(--sand);margin-top:3px}
.drill p{font-size:13px;color:var(--cream-dim);margin-top:9px}
.tag{display:inline-block;font-size:10px;letter-spacing:.07em;color:var(--teal);border:1px solid var(--teal-dim);border-radius:2px;padding:2px 7px;margin:4px 5px 0 0}
.tag.slot{color:var(--sand);border-color:var(--line)}
.tag.pro{color:#0B1B29;background:var(--cream-dim);border-color:var(--cream-dim);font-weight:600}
.tag.short{color:#0B1B29;background:var(--alert);border-color:var(--alert);font-weight:600}
a.vid{display:inline-block;font-size:10px;letter-spacing:.07em;color:#08161F;background:var(--teal);border-radius:2px;padding:3px 8px;margin:4px 5px 0 0;text-decoration:none;font-weight:600}
a.vid:hover{background:#4FC9BA}
.vcard{background:var(--navy);border:1px solid var(--line);border-radius:2px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.vcard .thumb{aspect-ratio:16/9;background:#000 center/cover no-repeat;display:block;position:relative}
.vcard .thumb:after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;text-shadow:0 2px 12px rgba(0,0,0,.7);opacity:.9}
.vcard .vb{padding:12px 14px}
.vcard .vt{font-size:13.5px;font-weight:500;line-height:1.35}
.vcard .vm{font-size:11px;color:var(--sand);margin-top:5px}
.cart{position:fixed;left:228px;right:0;bottom:0;background:var(--navy-3);border-top:1px solid var(--teal-dim);padding:12px 44px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;z-index:30}
.cart .c1{font-size:14px;font-weight:500}.cart .c2{font-size:12.5px;color:var(--cream-dim)}
.cart .sp{margin-left:auto;display:flex;gap:8px}.cart.hide{display:none}
.big{font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1.15;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--teal);color:#08161F;font-size:13.5px;font-weight:500;padding:13px 22px;border-radius:2px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.feed li{list-style:none;font-size:13.5px;color:var(--cream-dim);padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:11px}
.feed li:last-child{border:0}
.feed .when{color:var(--sand);font-size:12px;flex:0 0 60px}
.chat{max-height:46vh;min-height:240px;overflow-y:auto;padding-right:6px}
.msg{margin-bottom:14px;max-width:84%}
.msg .who{font-size:10.5px;letter-spacing:.1em;color:var(--sand);margin-bottom:4px}
.msg .bub{padding:13px 16px;border-radius:3px;font-size:14px;line-height:1.65}
.msg.you{margin-left:auto}.msg.you .bub{background:var(--navy-3)}.msg.you .who{text-align:right}
.msg.bot .bub{background:var(--cream);color:#112838}
.msg.bot .bub strong{font-weight:600}
.msg.bot .bub a{color:var(--teal-dim);cursor:pointer;font-weight:500;text-decoration:underline}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#5C6874;margin-right:4px;animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
.tipcard{background:var(--navy);border:1px solid var(--line);border-radius:2px;padding:15px;cursor:pointer}
.tipcard:hover{border-color:var(--teal-dim)}
.tipcard .t{font-size:14px;font-weight:500}
.tipcard .c{font-size:11px;color:var(--sand);margin-top:3px}
.tiplist{counter-reset:t}
.tiplist li{list-style:none;margin-bottom:14px;padding-left:32px;position:relative;font-size:14px;color:var(--cream-dim)}
.tiplist li:before{counter-increment:t;content:counter(t);position:absolute;left:0;top:0;font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--teal)}
.tiplist strong{color:var(--cream);font-weight:500}
.note{font-size:12.5px;color:var(--sand);border-left:1px solid var(--line);padding-left:13px;margin-top:14px}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.cmp td,table.cmp th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table.cmp th{color:var(--sand);font-weight:600;font-size:11px;letter-spacing:.07em}
table.cmp td:first-child,table.cmp th:first-child{text-align:left;color:var(--cream)}
@media(max-width:860px){
 .app{flex-direction:column}
 .rail{width:100%;flex:none;height:auto;position:sticky;top:0;z-index:40;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
 .brand{display:none}
 .railfoot{margin:0 0 0 auto;padding:0 4px 0 12px;border:0;flex:0 0 auto}
 .navbtn{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:8px 10px}
 .navbtn.on{border-left:0;border-bottom-color:var(--teal);background:none}
 main{padding:24px 18px 120px}
 .vhead h1{font-size:31px}
 .grid4,.grid3{grid-template-columns:1fr 1fr}
 .cart{left:0;padding:12px 18px}
 .hero .n{font-size:48px}
}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:200;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px">
 <div style="width:100%;max-width:400px">
  <div style="text-align:center;margin-bottom:28px">
   <div style="font-family:'Cormorant Garamond',serif;font-weight:700;font-size:32px;letter-spacing:.15em">HAMER</div>
   <div style="font-size:10px;letter-spacing:.26em;color:var(--teal);margin-top:5px;font-weight:600">BRAIN</div>
  </div>
  <div class="panel" style="margin:0">
   <div class="chips" style="margin-bottom:20px" id="gate-tabs"></div>
   <div id="gate-body"></div>
  </div>
  <div class="muted" style="text-align:center;font-size:11.5px;margin-top:16px" id="gate-foot"></div>
 </div>
</div>
<div class="app">
<nav class="rail">
 <div class="brand"><div class="mark">HAMER</div><div class="sub">BRAIN</div></div>
 <button class="navbtn on" data-go="today"><span class="ico">◈</span><span data-t="nav.today"></span></button>
 <button class="navbtn" data-go="brain"><span class="ico">✻</span><span data-t="nav.brain"></span></button>
 <button class="navbtn" data-go="game"><span class="ico">◉</span><span data-t="nav.game"></span></button>
 <button class="navbtn" data-go="diag"><span class="ico">◇</span><span data-t="nav.diag"></span></button>
 <button class="navbtn" data-go="practice"><span class="ico">▤</span><span data-t="nav.practice"></span></button>
 <button class="navbtn" data-go="videos"><span class="ico">▶</span><span data-t="nav.videos"></span></button>
 <button class="navbtn" data-go="tips"><span class="ico">✦</span><span data-t="nav.tips"></span></button>
 <button class="navbtn" data-go="guide"><span class="ico">?</span><span data-t="nav.guide"></span></button>
 <div class="railfoot">
  <button class="navbtn" id="nav-logout" style="display:none"><span class="ico">⏻</span><span data-t="nav.logout"></span></button>
  <div class="langsw"><button data-lang="es" class="on">ES</button><button data-lang="en">EN</button></div>
 </div>
</nav>
<main>

<section class="view on" id="v-today">
 <div class="vhead"><h1 data-t="today.h"></h1><p data-t="today.p"></p></div>
 <div class="panel cream">
  <div class="muted" style="font-size:11px;letter-spacing:.1em" id="hero-label"></div>
  <div class="hero"><div class="n" id="hero-n"></div><div class="u" id="hero-u"></div></div>
 </div>
 <div class="row">
  <div class="panel" style="border-color:var(--teal-dim)">
   <h3 data-t="q.h"></h3>
   <div class="muted" style="margin-bottom:14px" data-t="q.p"></div>
   <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
    <div style="flex:1;min-width:110px"><label class="f" data-t="g.score"></label><input id="q-score" placeholder="78" inputmode="numeric"></div>
    <div style="flex:1;min-width:110px"><label class="f" data-t="g.putts"></label><input id="q-putts" placeholder="32" inputmode="numeric"></div>
    <button class="btn" id="q-save" data-t="q.save"></button>
   </div>
   <div class="note" data-t="q.note"></div>
  </div>
  <div class="panel">
   <h3 data-t="st.h"></h3>
   <div class="hero" style="margin:6px 0 4px"><div class="n good" id="streak-n" style="font-size:52px"></div><div class="u" id="streak-u" style="color:var(--cream-dim)"></div></div>
   <div id="weeks" style="display:flex;gap:5px;margin-top:12px"></div>
   <div class="muted" style="font-size:11.5px;margin-top:8px" data-t="st.p"></div>
  </div>
 </div>
 <div class="panel cream" id="mom"></div>
 <div class="row">
  <div class="panel">
   <h3 data-t="today.where"></h3>
   <div class="muted" style="margin-bottom:16px" id="sg-sub"></div>
   <div id="sgbars"></div>
   <div class="legend"><span data-t="sg.gain"></span><span data-t="sg.lose"></span></div>
  </div>
  <div class="panel">
   <h3 data-t="today.trend"></h3>
   <div class="muted" style="margin-bottom:10px" id="trend-sub"></div>
   <div id="trend"></div>
  </div>
 </div>
 <div class="row">
  <div class="panel cream">
   <h3 data-t="today.prio"></h3>
   <p id="priority" style="font-size:14.5px;line-height:1.6"></p>
   <div class="hr" style="background:rgba(17,40,56,.12)"></div>
   <div class="muted" style="font-size:12.5px" id="priority-why"></div>
   <div style="margin-top:16px">
    <button class="btn sm" data-go="practice" data-t="today.build"></button>
    <button class="btn sm" data-go="brain" style="margin-left:8px;background:#112838;color:#F2EDE1" data-t="today.askbrain"></button>
   </div>
  </div>
  <div class="panel">
   <h3 data-t="today.vday"></h3>
   <div class="muted" style="margin-bottom:12px" data-t="today.vdayp"></div>
   <div id="vday"></div>
  </div>
 </div>
 <div class="panel"><h3 data-t="today.changed"></h3><ul class="feed" id="feed"></ul></div>
</section>

<section class="view" id="v-brain">
 <div class="vhead"><h1 data-t="brain.h"></h1><p data-t="brain.p"></p></div>
 <div class="panel">
  <div class="chat" id="chat"></div>
  <div class="hr"></div>
  <div style="display:flex;gap:10px">
   <input id="ask-in" data-ph="brain.ph" style="flex:1">
   <button class="btn" id="ask-send" data-t="brain.send"></button>
  </div>
  <div class="chips" style="margin-top:14px" id="sugs"></div>
  <div class="note" data-t="brain.freep"></div>
 </div>
</section>

<section class="view" id="v-guide">
 <div class="vhead"><h1 data-t="gd.h"></h1><p data-t="gd.p"></p></div>
 <div class="panel"><div class="grid3" id="gd-incl"></div></div>
 <div class="panel"><h3 data-t="gd.start"></h3><div id="gd-steps"></div></div>
 <div class="row">
  <div class="panel"><h3 data-t="gd.week"></h3><div id="gd-week"></div></div>
  <div class="panel"><h3 data-t="gd.faq"></h3><div id="gd-faq"></div></div>
 </div>
</section>

<section class="view" id="v-game">
 <div class="vhead"><h1 data-t="game.h"></h1><p data-t="game.p"></p></div>
 <div class="panel">
  <h3 data-t="game.profile"></h3>
  <div class="grid4">
   <div><label class="f" data-t="game.hcp"></label><input id="p-hcp" value="8.4"></div>
   <div><label class="f" data-t="game.age"></label><input id="p-age" value="16"></div>
   <div><label class="f" data-t="game.zone"></label><input id="p-zone" value="Madrid"></div>
   <div><label class="f" data-t="game.goal"></label><input id="p-goal" value="2.0"></div>
  </div>
  <div class="note" data-t="game.goalnote"></div>
  <div class="hr"></div>
  <h3 data-t="game.dist"></h3>
  <div class="muted" style="margin-bottom:12px" data-t="game.distp"></div>
  <div class="grid4" id="clubs"></div>
  <div style="margin-top:16px"><button class="btn ghost sm" id="save-prof" data-t="game.saveprof"></button></div>
 </div>
 <div class="panel">
  <h3 data-t="game.feed"></h3>
  <div class="chips" style="margin:12px 0 20px">
   <button class="chip on" data-input="round" data-t="game.mround"></button>
   <button class="chip" data-input="self" data-t="game.mself"></button>
  </div>
  <div id="in-round">
   <div class="grid4">
    <div><label class="f" data-t="g.score"></label><input id="r-score" placeholder="78"></div>
    <div><label class="f" data-t="g.fw"></label><input id="r-fw" placeholder="7"></div>
    <div><label class="f" data-t="g.gir"></label><input id="r-gir" placeholder="8"></div>
    <div><label class="f" data-t="g.putts"></label><input id="r-putts" placeholder="33"></div>
   </div>
   <div class="grid4" style="margin-top:12px">
    <div><label class="f" data-t="g.ud"></label><input id="r-ud" placeholder="3"></div>
    <div><label class="f" data-t="g.uda"></label><input id="r-uda" placeholder="8"></div>
    <div><label class="f" data-t="g.bk"></label><input id="r-bk" placeholder="1"></div>
    <div><label class="f" data-t="g.bka"></label><input id="r-bka" placeholder="3"></div>
   </div>
   <div class="grid4" style="margin-top:12px">
    <div><label class="f" data-t="g.pen"></label><input id="r-pen" placeholder="2"></div>
    <div><label class="f" data-t="g.w"></label><input id="r-w" placeholder="2"></div>
    <div><label class="f" data-t="g.wa"></label><input id="r-wa" placeholder="6"></div>
   </div>
   <div style="margin-top:18px"><button class="btn" id="save-round" data-t="g.save"></button></div>
   <div class="note" data-t="g.note"></div>
  </div>
  <div id="in-self" style="display:none">
   <div class="muted" style="margin-bottom:14px" data-t="game.selfp"></div>
   <div class="chips" id="selfchips"></div>
   <div style="margin-top:18px"><button class="btn" id="save-self" data-t="g.save2"></button></div>
  </div>
 </div>
 <div class="panel"><h3 data-t="game.hist"></h3><table class="cmp" id="hist"></table></div>
</section>

<section class="view" id="v-diag">
 <div class="vhead"><h1 data-t="diag.h"></h1><p data-t="diag.p"></p></div>
 <div class="panel">
  <div style="margin-bottom:22px"><label class="f" data-t="diag.q1"></label><div class="chips" data-q="club"></div></div>

 g.putt=+((r.putts-e.putts)).toFixed(2);
 g.hierros=+((e.gir-r.gir)*.46).toFixed(2);
 g.driver=+((e.fw-r.fw)*.26+Math.max(0,r.pen-e.pen)*.9).toFixed(2);
 g.chipping=r.uda>0?+(((e.ud*r.uda)-r.ud)*.82).toFixed(2):S.sg.chipping;
 g.bunker=r.bka>0?+(((e.sand*r.bka)-r.bk)*.82).toFixed(2):S.sg.bunker;
 g.wedges=r.wa>0?+(((e.wedge*r.wa)-r.w)*.55).toFixed(2):S.sg.wedges;
 return g}
const totalSG=()=>+Object.values(S.sg).reduce((a,b)=>a+b,0).toFixed(1);
const worst=()=>AREAS.slice().sort((a,b)=>S.sg[b]-S.sg[a])[0];

function weekKey(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10)}
function renderStreak(){
 const set=new Set([...S.acts,...S.rounds.map(r=>r.dt)].map(weekKey));
 const thisW=weekKey(new Date(NOW).toISOString().slice(0,10));
 let n=0,cur=new Date(thisW);
 if(!set.has(thisW))cur=new Date(new Date(thisW).getTime()-7*DAY);
 while(set.has(cur.toISOString().slice(0,10))){n++;cur=new Date(cur.getTime()-7*DAY)}
 $('#streak-n').textContent=n;
 $('#streak-u').textContent=n===0?t('st.none'):(n===1?t('st.w1'):t('st.w'));
 const cells=[];for(let i=11;i>=0;i--){const k=weekKey(new Date(NOW-i*7*DAY).toISOString().slice(0,10));cells.push(set.has(k))}
 $('#weeks').innerHTML=cells.map(a=>`<div style="flex:1;height:20px;border-radius:2px;background:${a?'var(--good)':'rgba(242,237,225,.09)'}"></div>`).join('');
}

 const ds=sB-sA,dl=lB-lA;

 <div class="hr" style="background:rgba(17,40,56,.12)"></div>
 <table class="cmp" style="color:#112838">
 <tr><th style="color:#5C6874"></th><th style="color:#5C6874">${L==='es'?'30 días':'30 days'}</th><th style="color:#5C6874">${L==='es'?'30 previos':'Prior 30'}</th></tr>
 <tr><td style="color:#112838">${t('mom.rounds')}</td><td>${A.length}</td><td>${B.length}</td></tr>
 <tr><td style="color:#112838">${t('mom.avg')}</td><td>${sA.toFixed(1)}</td><td>${sB.toFixed(1)}</td></tr>
 <tr><td style="color:#112838">${t('mom.lost')}</td><td>${lA.toFixed(1)}</td><td>${lB.toFixed(1)}</td></tr></table>
 <div class="hr" style="background:rgba(17,40,56,.12)"></div>
 <div style="font-size:11px;letter-spacing:.1em;color:#5C6874">${t('mom.report').toUpperCase()}</div>
 <p style="font-size:14px;line-height:1.65;margin-top:8px;max-width:64ch">${L==='es'
  ?`Jugaste ${A.length} ${A.length===1?'ronda':'rondas'} en los últimos 30 días con promedio de ${sA.toFixed(1)}. Tu mejor vuelta fue ${Math.min(...A.map(r=>+r.score||999))}. Hoy dejas ${totalSG().toFixed(1)} golpes por vuelta contra tu objetivo de hándicap ${S.goal}, y ${an(ord[0])} sigue siendo el área que más te cuesta con ${S.sg[ord[0]].toFixed(1)}. Si el próximo mes trabajas eso y ${an(ord[1])}, ahí está la mayor parte de lo que puedes recuperar.`
  :`You played ${A.length} ${A.length===1?'round':'rounds'} in the last 30 days averaging ${sA.toFixed(1)}. Your best was ${Math.min(...A.map(r=>+r.score||999))}. You currently leave ${totalSG().toFixed(1)} strokes per round against your ${S.goal} handicap target, and ${an(ord[0])} is still the costliest area at ${S.sg[ord[0]].toFixed(1)}. Work that and ${an(ord[1])} next month and that is where most of your recoverable strokes sit.`}</p>`;
}

  </svg><div class="muted" style="font-size:11.5px;margin-top:6px">${rs.map((r,i)=>`R${i+1}: ${r.score||'—'}`).join(' · ')}</div>`;
 } else $('#trend').innerHTML=`<div class="muted">${t('noround')}</div>`;

 const seed=daySeed();

 $('#feed').innerHTML=S.feed.length?S.feed.map(f=>`<li><span class="when">${P(f.w)}</span><span>${P(f.x)}</span></li>`).join('')
  :`<li><span class="muted">${t('noround')}</span></li>`;
}
function vcardHTML(v,ctl){
 if(!v)return '';
 const seen=S.seen.includes(v.id),nw=isNew(v,weekSeed());
 return `<div class="vcard" style="${seen?'opacity:.5':''}"><a class="thumb" href="${vurl(v)}" target="_blank" rel="noopener" style="background-image:url(${vthumb(v)})" aria-label="${P(v.ti)}"></a>
 <div class="vb"><div class="vt">${P(v.ti)}</div><div class="vm">${an(v.a)}${v.pro?' · '+v.pro:''}</div>
 <div>${v.short?`<span class="tag short">${t('vid.short2')}</span>`:''}${nw&&!seen?`<span class="tag">${t('vid.new')}</span>`:''}</div>
 ${ctl?`<div style="margin-top:8px"><button class="btn ghost sm" data-seen="${v.id}">${seen?t('vid.unseen'):t('vid.markseen')}</button></div>`:''}</div></div>`;
}
/* ===== MOTOR DE ROTACIÓN =====
   weekSeed cambia cada lunes. Rota qué videos salen y en qué orden, marca los
   nuevos de la semana, y esconde los que el socio ya marcó como vistos.
   En producción, fetchTopic() llama a la API de YouTube (cuota gratuita)
   restringida a CHANNELS y devuelve resultados frescos por tema. */
const weekSeed=()=>Math.floor(NOW/(7*DAY));
const daySeed=()=>Math.floor(NOW/DAY);
function rotate(list,seed){const n=list.length;if(!n)return [];const k=seed%n;return list.slice(k).concat(list.slice(0,k))}
function isNew(v,seed){return (v.id.charCodeAt(0)+v.id.charCodeAt(3)+seed)%4===0}
function ytSearch(topic,ch){
 const q=encodeURIComponent(`${topic} golf ${ch||''}`.trim());
 return `https://www.youtube.com/results?search_query=${q}&sp=CAMSAhAB`;
}
function renderVideos(){
 const f=window._vf||'all',len=window._vl||'all',ws=weekSeed();
 $('#vfilter').innerHTML=`<button class="chip ${f==='all'?'on':''}" data-vf="all">${t('vid.all')}</button>`+AREAS.map(a=>`<button class="chip ${f===a?'on':''}" data-vf="${a}">${an(a)}</button>`).join('');
 $('#vlen').innerHTML=[['all',t('vid.all')],['short',t('vid.short')],['long',t('vid.long')]].map(([k,lb])=>`<button class="chip ${len===k?'on':''}" data-vl="${k}">${lb}</button>`).join('')
  +`<button class="chip ${window._vs?'on':''}" data-vs="1">${t('vid.hideseen')}</button>`;
 let l=VIDEOS.filter(v=>(f==='all'||v.a===f)&&(len==='all'||(len==='short'?v.short:!v.short)));
 if(window._vs)l=l.filter(v=>!S.seen.includes(v.id));
 const ord=AREAS.slice().sort((a,b)=>S.sg[b]-S.sg[a]);
 l=rotate(l,ws).sort((a,b)=>ord.indexOf(a.a)-ord.indexOf(b.a));
 $('#vgrid').innerHTML=l.length?l.map(v=>vcardHTML(v,true)).join(''):`<div class="muted">${t('vid.empty')}</div>`;
 /* temas en vivo */
 const tp=f==='all'?Object.entries(TOPICS).flatMap(([a,xs])=>xs.map(x=>[a,x])):TOPICS[f].map(x=>[f,x]);
 const rt=rotate(tp,ws);
 $('#vtopics').innerHTML=rt.map(([a,x],i)=>{
  const ch=CHANNELS[(ws+i)%CHANNELS.length].n;
  return `<a class="tag" style="text-transform:none;text-decoration:none;cursor:pointer" href="${ytSearch(x,ch)}" target="_blank" rel="noopener" title="${ch}">${x} ↗</a>`}).join('');
 $('#vtcount').textContent=L==='es'
  ?`${tp.length} temas × ${CHANNELS.length} canales = ${tp.length*CHANNELS.length} consultas distintas. La combinación rota cada semana, así que nunca ves la misma lista dos meses seguidos.`
  :`${tp.length} topics × ${CHANNELS.length} channels = ${tp.length*CHANNELS.length} distinct queries. The pairing rotates weekly, so you never see the same list two months running.`;
 $('#vchan').innerHTML=CHANNELS.map(c=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><div style="font-size:13.5px;font-weight:500">${c.n}</div><div class="muted" style="font-size:12px">${P(c.d)}</div></div>`).join('');
}

function localAnswer(q){
 const s=q.toLowerCase(),w=worst(),ord=AREAS.slice().sort((a,b)=>S.sg[b]-S.sg[a]);
 const es=L==='es';
 const dfor=a=>DRILLS.filter(d=>d.a===a);
 const vfor=a=>vFor(a).slice(0,2).map(v=>`<a href="${vurl(v)}" target="_blank" rel="noopener">${P(v.ti)}</a>`).join(' · ');
 const yards=(()=>{const m=s.match(/(\d{2,3})\s*(yardas|yards|y\b|yd)/);return m?+m[1]:null})();
 if(yards){
  const e=Object.entries(S.clubs).sort((a,b)=>Math.abs(a[1]-yards)-Math.abs(b[1]-yards));
  const [c1,d1]=e[0],[c2,d2]=e[1];
  return es?`Desde <strong>${yards} yardas</strong> tu palo es el <strong>${c1}</strong> (${d1} de carry). El siguiente más cercano es el ${c2} a ${d2}.<br><br>Si es cuesta arriba, con viento en contra o a bandera trasera, sube un palo y pega más suave: casi siempre gana al swing forzado.`
   :`From <strong>${yards} yards</strong> your club is the <strong>${c1}</strong> (${d1} carry). Next closest is the ${c2} at ${d2}.<br><br>Uphill, into wind, or to a back pin: take one more and swing easier. That almost always beats forcing it.`;
 }
 if(/pierdo|perdiendo|losing|lose|dónde|donde|where|prioridad|priority/.test(s))
  return es?`Tu peor área es <strong>${an(w)}</strong>: ${S.sg[w].toFixed(1)} golpes por vuelta contra un hándicap ${S.goal}. En total dejas ${totalSG().toFixed(1)} golpes.<br><br>Orden real de prioridad: ${ord.map(an).join(' › ')}.<br><br>Empieza por ${P(dfor(w)[0].nm)}, meta ${target(dfor(w)[0])} ${P(dfor(w)[0].u)}.<br><br><a data-link="practice">Ver ejercicios</a>`
   :`Your worst area is <strong>${an(w)}</strong>: ${S.sg[w].toFixed(1)} strokes per round against a ${S.goal} handicap. Total ${totalSG().toFixed(1)} strokes left out there.<br><br>Priority order: ${ord.map(an).join(' › ')}.<br><br>Start with ${P(dfor(w)[0].nm)}, target ${target(dfor(w)[0])} ${P(dfor(w)[0].u)}.<br><br><a data-link="practice">See drills</a>`;
 const mins=(()=>{const m=s.match(/(\d{2,3})\s*(min|minutos|minutes)/);return m?+m[1]:(/hora|hour/.test(s)?60:null)})();
 if(mins){
  const l=dfor(w).slice(0,mins>=60?3:2);
  return es?`Con ${mins} minutos no repartas. Todo a <strong>${an(w)}</strong>, donde pierdes ${S.sg[w].toFixed(1)} golpes:<br><br>${l.map(d=>'· '+P(d.nm)+' — '+d.min+' min, meta '+target(d)+' '+P(d.u)).join('<br>')}<br><br><a data-link="practice">Armar sesión</a>`
   :`With ${mins} minutes do not spread it. All into <strong>${an(w)}</strong>, where you lose ${S.sg[w].toFixed(1)} strokes:<br><br>${l.map(d=>'· '+P(d.nm)+' — '+d.min+' min, target '+target(d)+' '+P(d.u)).join('<br>')}<br><br><a data-link="practice">Build session</a>`;
 }
 for(const a of AREAS){
  const kw={driver:/driver|tee|slice|hook|lejos|distancia|far/,hierros:/hierro|iron|gordo|fat|filo|thin|shank|compres/,
   wedges:/wedge|100 yard|pitch/,chipping:/chip|juego corto|short game|alrededor/,bunker:/bunker|arena|sand/,putt:/putt|green|tres putt|three putt/}[a];
  if(kw&&kw.test(s)){
   const d=dfor(a)[0];
   return es?`En <strong>${an(a)}</strong> estás ${S.sg[a]>0?'perdiendo':'ganando'} ${Math.abs(S.sg[a]).toFixed(1)} golpes por vuelta.<br><br>El ejercicio que te toca es <strong>${P(d.nm)}</strong> — ${d.min} min, meta ${target(d)} ${P(d.u)} para tu objetivo de hándicap ${S.goal}.<br><br>Videos: ${vfor(a)}<br><br><a data-link="diag">Diagnosticar el patrón</a> · <a data-link="tips">Tips rápidos</a>`
    :`In <strong>${an(a)}</strong> you are ${S.sg[a]>0?'losing':'gaining'} ${Math.abs(S.sg[a]).toFixed(1)} strokes per round.<br><br>Your drill is <strong>${P(d.nm)}</strong> — ${d.min} min, target ${target(d)} ${P(d.u)} for your ${S.goal} handicap goal.<br><br>Videos: ${vfor(a)}<br><br><a data-link="diag">Diagnose the pattern</a> · <a data-link="tips">Quick tips</a>`;
  }
 }
 if(/torneo|tournament|campo|course|estrategia|strategy/.test(s))
  return es?`Selección de torneos y estrategia hoyo por hoyo son parte de <strong>HAMER Consult</strong>, el servicio uno a uno.<br><br>Aquí sí puedo darte estrategia general y prepararte para el torneo que ya tengas.<br><br><a data-link="tips">Tips de estrategia</a>`
   :`Tournament selection and hole-by-hole strategy belong to <strong>HAMER Consult</strong>, the one-to-one service.<br><br>Here I can give you general strategy and prepare you for the event you already have.<br><br><a data-link="tips">Strategy tips</a>`;
 if(/mes|meses|month|esperar|expect|meta|goal/.test(s))
  return es?`Hoy dejas ${totalSG().toFixed(1)} golpes por vuelta contra tu objetivo de ${S.goal}. La mayor parte está en ${an(ord[0])} y ${an(ord[1])}.<br><br>Trabajando esas dos áreas de forma consistente, esos golpes son lo primero que se recupera. Registra tus rondas y la gráfica de seguimiento te lo va a mostrar.<br><br><a data-link="today">Ver seguimiento</a>`
   :`Right now you leave ${totalSG().toFixed(1)} strokes per round against your ${S.goal} target. Most of it sits in ${an(ord[0])} and ${an(ord[1])}.<br><br>Work those two consistently and those are the first strokes to come back. Log your rounds and the tracking chart will show it.<br><br><a data-link="today">See tracking</a>`;
 return es?`Puedo darte tu desglose de golpes perdidos, decirte qué palo desde una distancia, armarte la práctica según el tiempo que tengas, y mandarte al ejercicio, tip o video que te toca.<br><br>Prueba con "dónde pierdo golpes", "qué palo desde 150 yardas" o "tengo 45 minutos".`
  :`I can give you your strokes-lost breakdown, tell you what club from a yardage, build your practice around the time you have, and point you to the right drill, tip or video.<br><br>Try "where do I lose strokes", "what club from 150 yards" or "I have 45 minutes".`;
}

 setTimeout(()=>{CHAT.push({r:'bot',t:localAnswer(q)});renderChat()},260);
}

   body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:ctx(),

 const dq=X.closest('[data-q] .chip');if(dq)dq.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===dq));
 const du=X.closest('[data-dur]');if(du){S.dur=+du.dataset.dur;renderPr()}
 const lf=X.closest('[data-lib]');if(lf){renderPr._f=lf.dataset.lib;window._lf=lf.dataset.lib;renderPr()}
 const vf=X.closest('[data-vf]');if(vf){window._vf=vf.dataset.vf;renderVideos()}
 const vl=X.closest('[data-vl]');if(vl){window._vl=vl.dataset.vl;renderVideos()}
 const ad=X.closest('[data-add]');
 if(ad){const d=DRILLS.find(x=>x.id===ad.dataset.add);
  if(!S.cart.some(x=>x.id===d.id)){S.cart.push(d);renderLib(window._lf);renderCart();toast(t('ok.add'))}}
 const rm=X.closest('[data-rm]');
 if(rm){S.cart=S.cart.filter(x=>x.id!==rm.dataset.rm);renderLib(window._lf);renderCart()}
 const tc=X.closest('[data-cat]');if(tc)renderTips(tc.dataset.cat);
 const tp=X.closest('[data-tip]');if(tp){const[c,i]=tp.dataset.tip.split('|');openTip(c,+i)}
 if(X.classList.contains('sug')){go('brain');send(X.textContent)}
});
$('#cart-clear').onclick=()=>{S.cart=[];renderLib(window._lf);renderCart()};
$('#cart-start').onclick=()=>{let done=0;const n=S.cart.length;
 S.cart.forEach(d=>{const ok=confirm(`${P(d.nm)}\n\n${t('pr.goal')}: ${target(d)} ${P(d.u)}\n\n${L==='es'?'¿La cumpliste?':'Did you hit it?'}`);
  S.sg[d.a]=+Math.max(-2,Math.min(6,S.sg[d.a]+(ok?-0.25:0.15))).toFixed(2);if(ok)done++});
 S.feed.unshift({w:['ahora','now'],x:[`Sesión registrada: ${done} de ${n} metas cumplidas.`,`Session logged: ${done} of ${n} targets hit.`]});
 S.acts.push(new Date(NOW).toISOString().slice(0,10));
 S.cart=[];renderLib(window._lf);renderCart();renderToday();renderVideos();go('today');
 toast(L==='es'?'Sesión registrada':'Session logged')};
$('#build').onclick=()=>{
 const ord=AREAS.slice().sort((a,b)=>S.sg[b]-S.sg[a]);
 const pool=DRILLS.slice().sort((a,b)=>ord.indexOf(a.a)-ord.indexOf(b.a));
 S.cart=[];let m=0;const u={};
 for(const d of pool){if(m+d.min>S.dur)continue;if((u[d.a]||0)>=2)continue;S.cart.push(d);m+=d.min;u[d.a]=(u[d.a]||0)+1;if(m>=S.dur-10)break}
 renderLib(window._lf);renderCart();toast(L==='es'?'Sesión lista abajo':'Session ready below')};
$('#save-prof').onclick=()=>{
 S.hcp=parseFloat($('#p-hcp').value)||S.hcp;
 const gg=parseFloat($('#p-goal').value);S.goal=isNaN(gg)?0:gg;
 S.age=$('#p-age').value;S.zone=$('#p-zone').value;
 $$('[data-club]').forEach(i=>{const v=parseFloat(i.value);if(!isNaN(v))S.clubs[i.dataset.club]=v});
 if(S.last){const g=computeRound(S.last);AREAS.forEach(a=>S.sg[a]=g[a])}
 renderToday();renderPr();renderVideos();toast(L==='es'?'Perfil aplicado':'Profile applied')};
$('#save-round').onclick=()=>{
 const gv=id=>{const v=parseFloat($(id).value);return isNaN(v)?null:v};
 const e=expect(S.goal);
 const r={score:gv('#r-score'),fw:gv('#r-fw')??+e.fw.toFixed(1),gir:gv('#r-gir')??+e.gir.toFixed(1),
  putts:gv('#r-putts')??+e.putts.toFixed(1),ud:gv('#r-ud')||0,uda:gv('#r-uda')||0,
  bk:gv('#r-bk')||0,bka:gv('#r-bka')||0,w:gv('#r-w')||0,wa:gv('#r-wa')||0,pen:gv('#r-pen')||0};
 if(r.score===null&&gv('#r-putts')===null){toast(L==='es'?'Pon al menos score o putts':'Enter at least score or putts');return}
 const g=computeRound(r);AREAS.forEach(a=>S.sg[a]=g[a]);S.last=r;r.total=totalSG();
 r.dt=new Date(NOW).toISOString().slice(0,10);S.acts.push(r.dt);
 S.rounds.unshift(r);
 S.feed.unshift({w:['ahora','now'],x:[`Ronda de ${r.score||'—'}. Peor área: ${an(worst())} (${num(S.sg[worst()])}).`,`Round of ${r.score||'—'}. Worst area: ${an(worst())} (${num(S.sg[worst()])}).`]});
 renderToday();renderGame();renderLib(window._lf);renderVideos();toast(t('ok.saved'));go('today')};
$('#save-self').onclick=()=>{
 $$('[data-self].on').forEach(c=>{const a=c.dataset.area,d=parseFloat(c.dataset.d);
  S.sg[a]=+Math.max(-2,Math.min(6,S.sg[a]+d)).toFixed(2)});
 S.feed.unshift({w:['ahora','now'],x:['Autoevaluación aplicada.','Self-assessment applied.']});
 renderToday();renderLib(window._lf);renderVideos();toast(t('ok.saved'));go('today')};
$('#run-diag').onclick=()=>{
 const get=q=>{const el=document.querySelector(`[data-q="${q}"] .chip.on`);return el?el.dataset.v:null};
 const cl=get('club'),st=get('start'),cu=get('curve'),co=get('contact')||'clean';
 if(!cl||!st||!cu){toast(L==='es'?'Contesta las tres primeras':'Answer the first three');return}
 const r=diagnose(st,cu,co);
 const dr=r.dr.map(i=>DRILLS.find(d=>d.id===i)).filter(Boolean);
 const q=L==='es'?`Mi patrón es ${P(r.nm)} con ${cl==='D'?'driver':cl==='I'?'hierros':cl==='W'?'maderas':'wedges'}. ¿Cómo lo corrijo y qué practico esta semana?`
  :`My pattern is ${P(r.nm)} with ${cl==='D'?'driver':cl==='I'?'irons':cl==='W'?'woods':'wedges'}. How do I fix it and what should I practise this week?`;
 $('#diag-out').innerHTML=`
 <div class="panel cream"><div class="big">${P(r.nm)}</div>
 <p style="font-size:14.5px;line-height:1.65;max-width:62ch">${P(r.w)}</p>
 <div class="hr" style="background:rgba(17,40,56,.12)"></div>
 <div style="font-size:13.5px;color:#5C6874">${t('diag.path')}: ${P(r.p)} · ${t('diag.face')}: ${P(r.f)}</div>
 ${r.extra?`<div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(17,40,56,.12)"><strong style="font-weight:600">${P(r.extra.t)}</strong><p style="font-size:14px;margin-top:6px;max-width:62ch">${P(r.extra.d)}</p></div>`:''}</div>
 <div class="panel"><h3>${t('diag.now')}</h3><div style="margin-bottom:14px">${vidTag(r.vid)}</div>
 <ul class="tiplist">${r.x.map(f=>`<li>${P(f)}</li>`).join('')}</ul>
 <button class="btn ghost sm" data-askq="${encodeURIComponent(q)}">${t('diag.ask')}</button></div>
 <div class="panel"><h3>${t('diag.dr')}</h3>${dr.map(dHTML).join('')}</div>`;
 $('#diag-out').scrollIntoView({behavior:'smooth',block:'start'})};
$('#q-save').onclick=()=>{
 const sc=parseFloat($('#q-score').value),pu=parseFloat($('#q-putts').value);
 if(isNaN(sc)&&isNaN(pu)){toast(L==='es'?'Pon el score o los putts':'Enter score or putts');return}
 const e=expect(S.goal);
 const gap=isNaN(sc)?0:(sc-e.score);
 const r={dt:new Date(NOW).toISOString().slice(0,10),score:isNaN(sc)?null:sc,
  fw:+Math.max(0,Math.min(14,e.fw-gap*.28)).toFixed(1),
  gir:+Math.max(0,Math.min(18,e.gir-gap*.42)).toFixed(1),
  putts:isNaN(pu)?+Math.max(24,e.putts+gap*.30).toFixed(1):pu,
  ud:0,uda:0,bk:0,bka:0,w:0,wa:0,pen:Math.max(0,Math.round(e.pen+gap*.12))};
 const g=computeRound(r);AREAS.forEach(a=>S.sg[a]=g[a]);S.last=r;r.total=totalSG();
 S.rounds.unshift(r);S.acts.push(r.dt);
 S.feed.unshift({w:['ahora','now'],x:[`Registro rápido: ${r.score||'—'}. Peor área: ${an(worst())} (${num(S.sg[worst()])}).`,`Quick log: ${r.score||'—'}. Worst area: ${an(worst())} (${num(S.sg[worst()])}).`]});
 $('#q-score').value='';$('#q-putts').value='';
 renderToday();renderGame();renderLib(window._lf);renderVideos();toast(t('ok.saved'))};

const SUPABASE_URL='https://zdpyvbdbalmyglifnfka.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_SexERmc0-DT3JQoJSvSe0A_mZANkcPm';

/* ===== PUERTA DE ACCESO =====
   Estados: login · signup. Cuentas reales via Supabase Auth. Sin cobro por ahora. */
let gateMode='login';
function renderGate(){
 const es=L==='es';
 $('#gate-tabs').innerHTML=[['login',es?'Iniciar sesión':'Sign in'],['signup',es?'Crear cuenta':'Create account']]
  .map(([k,lb])=>`<button class="chip ${gateMode===k?'on':''}" data-gate="${k}">${lb}</button>`).join('');
 const B=$('#gate-body');
 const isUp=gateMode==='signup';
 B.innerHTML=`
 <div style="margin-bottom:14px"><label class="f">${es?'CORREO':'EMAIL'}</label><input id="g-mail" type="email" placeholder="tu@correo.com" autocomplete="email"></div>
 <div style="margin-bottom:18px"><label class="f">${es?'CONTRASEÑA':'PASSWORD'}</label><input id="g-pass" type="password" placeholder="••••••••" autocomplete="${isUp?'new-password':'current-password'}"></div>
 <button class="btn" style="width:100%" id="g-go">${isUp?(es?'Crear cuenta':'Create account'):(es?'Entrar':'Sign in')}</button>
 ${!isUp?`<div style="text-align:center;margin-top:12px"><a class="muted" style="font-size:12.5px;cursor:pointer" id="g-forgot">${es?'Olvidé mi contraseña':'Forgot my password'}</a></div>`:''}`;
 $('#gate-foot').textContent=es?'Tus datos son privados y solo tú los ves':'Your data is private, only you can see it';
 const go=$('#g-go');
 go.onclick=async()=>{
  if(!sb){toast(es?'Falta conectar Supabase (SUPABASE_URL/ANON_KEY)':'Supabase not connected yet (SUPABASE_URL/ANON_KEY)');return}
  const m=($('#g-mail')||{}).value||'';
  const p=($('#g-pass')||{}).value||'';
  if(!m.includes('@')){toast(es?'Pon un correo válido':'Enter a valid email');return}
  if(p.length<6){toast(es?'La contraseña debe tener 6 caracteres o más':'Password must be 6+ characters');return}
  go.disabled=true;
  if(isUp){
   const{error}=await sb.auth.signUp({email:m,password:p});
   go.disabled=false;
   if(error){toast(error.message);return}
   toast(es?'Cuenta creada. Revisa tu correo si se pide confirmarlo.':'Account created. Check your email if confirmation is required.');
   const{data:{session}}=await sb.auth.getSession();
   if(session){await afterLogin()}else{gateMode='login';renderGate()}
  }else{
   const{error}=await sb.auth.signInWithPassword({email:m,password:p});
   go.disabled=false;
   if(error){toast(error.message);return}
   await afterLogin();
  }
 };
 const fg=$('#g-forgot');
 if(fg)fg.onclick=async()=>{
  if(!sb){toast(es?'Falta conectar Supabase':'Supabase not connected yet');return}
  const m=($('#g-mail')||{}).value||'';
  if(!m.includes('@')){toast(es?'Pon tu correo arriba primero':'Enter your email above first');return}
  await sb.auth.resetPasswordForEmail(m);
  toast(es?'Te mandamos un correo para recuperarla':'We sent you a reset email');
 };
}

 const g=e.target.closest('[data-gate]');
 if(g){gateMode=g.dataset.gate;renderGate()}
});
async function afterLogin(){
 await loadState();
 applyLang();renderToday();renderGame();renderVideos();
 $('#gate').style.display='none';
 $('#nav-logout').style.display='flex';
}

};

/* ===== GUARDADO POR CUENTA =====
   Cada socio ve solo sus datos: la tabla player_data tiene RLS en Supabase,
   así que aunque alguien manipule el navegador, la base de datos no entrega
   filas que no sean suyas. Ver GUIA-LOGIN-Y-PAGOS.md, Paso 1. */
async function saveState(){
 if(!sb)return;
 try{
  const{data:{user}}=await sb.auth.getUser();
  if(!user)return;
  await sb.from('player_data').upsert({
   user_id:user.id,
   data:{hcp:S.hcp,goal:S.goal,age:S.age,zone:S.zone,clubs:S.clubs,
         rounds:S.rounds,acts:S.acts,sg:S.sg,seen:S.seen,feed:S.feed.slice(0,20)},
   updated_at:new Date().toISOString()
  });
 }catch(e){}
}
async function loadState(){
 if(!sb)return false;
 try{
  const{data:{user}}=await sb.auth.getUser();
  if(!user)return false;
  const{data}=await sb.from('player_data').select('data').eq('user_id',user.id).single();
  if(data&&data.data){Object.assign(S,data.data);S.last=S.rounds[0]||null;return true}
 }catch(e){}
 return false;
}
document.addEventListener('click',e=>{
 const sn=e.target.closest('[data-seen]');
 if(sn){const id=sn.dataset.seen;
  S.seen=S.seen.includes(id)?S.seen.filter(x=>x!==id):S.seen.concat(id);
  renderVideos();renderToday();saveState();
  toast(S.seen.includes(id)?(L==='es'?'Marcado como visto':'Marked as seen'):(L==='es'?'Vuelto a la rotación':'Back in rotation'))}
 const vs=e.target.closest('[data-vs]');
 if(vs){window._vs=!window._vs;renderVideos()}
});
$('#ask-send').onclick=()=>{const v=$('#ask-in').value;$('#ask-in').value='';send(v)};
$('#ask-in').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value;e.target.value='';send(v)}});
(async()=>{
 applyLang();
 if(sb){
  const{data:{session}}=await sb.auth.getSession();
  if(session){await afterLogin()}else{renderGate()}
 }else{
  renderGate();
 }
 ['#q-save','#save-round','#save-self','#save-prof','#cart-start'].forEach(sel=>{
  const el=document.querySelector(sel); if(!el) return;
  const prev=el.onclick;
  el.onclick=function(ev){ if(prev) prev.call(this,ev); saveState(); };
 });
})();
